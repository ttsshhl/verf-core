version: "3.8"

networks:
  verf-net:
    name: verf-net

volumes:
  verf-workspace:
  verf-data:
  traefik-certs:

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - verf-net

  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    environment:
      REGRU_USERNAME: ${REGRU_USERNAME}
      REGRU_PASSWORD: ${REGRU_PASSWORD}
      REGRU_PROPAGATION_TIMEOUT: ${REGRU_PROPAGATION_TIMEOUT}
      REGRU_POLLING_INTERVAL: ${REGRU_POLLING_INTERVAL}
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=verf-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=regru"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Separate resolver for users' own custom domains — we don't have
      # registrar API access for arbitrary domains, so DNS-01 (above) isn't
      # possible there. HTTP-01 works for any domain whose DNS genuinely
      # points here, which is exactly the ownership check we need anyway.
      - "--certificatesresolvers.http.acme.httpchallenge=true"
      - "--certificatesresolvers.http.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.http.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.http.acme.storage=/letsencrypt/acme-http.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-certs:/letsencrypt
    networks:
      - verf-net
    depends_on:
      - docker-proxy

  landing:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`verfdeploy.ru`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=le"
      - "traefik.http.services.landing.loadbalancer.server.port=80"
    networks:
      - verf-net

  cabinet:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./cabinet:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cabinet.rule=Host(`cabinet.verfdeploy.ru`)"
      - "traefik.http.routers.cabinet.entrypoints=websecure"
      - "traefik.http.routers.cabinet.tls.certresolver=le"
      - "traefik.http.services.cabinet.loadbalancer.server.port=80"
    networks:
      - verf-net

  verf-core:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VERF_DATABASE_URL: sqlite:////data/verf.db
      VERF_WORKSPACE_DIR: /workspace
      VERF_DOCKER_NETWORK: verf-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - verf-workspace:/workspace
      - verf-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verf-api.rule=Host(`api.verfdeploy.ru`)"
      - "traefik.http.routers.verf-api.entrypoints=websecure"
      - "traefik.http.routers.verf-api.tls.certresolver=le"
      - "traefik.http.services.verf-api.loadbalancer.server.port=8000"
    networks:
      - verf-net
